<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <!-- Warm dark tile plus terracotta mark: the same identity the app wears in
         renderer/app.css (sidebar #1c1712, primary #C96442 to #E0855D). -->
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#251E17"/>
      <stop offset="1" stop-color="#12100C"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E89A72"/>
      <stop offset="1" stop-color="#C96442"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#tile)"/>

  <!-- the O of "O1" -->
  <circle cx="128" cy="128" r="73" fill="none" stroke="url(#mark)" stroke-width="25"/>

  <!-- the 1, set inside the counter -->
  <path d="M106 107 L130 85 L130 171" fill="none" stroke="#F7EFE6"
        stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
