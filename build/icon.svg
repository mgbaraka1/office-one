<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#272740"/>
      <stop offset="1" stop-color="#1a1a28"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f83e8"/>
      <stop offset="1" stop-color="#6f62cf"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- clock face -->
  <circle cx="128" cy="128" r="74" fill="none" stroke="url(#ring)" stroke-width="14"/>

  <!-- hour ticks -->
  <g fill="#b9b2ee">
    <rect x="124" y="62"  width="8" height="16" rx="4"/>
    <rect x="124" y="178" width="8" height="16" rx="4"/>
    <rect x="62"  y="124" width="16" height="8" rx="4"/>
    <rect x="178" y="124" width="16" height="8" rx="4"/>
  </g>

  <!-- hands -->
  <g stroke-linecap="round">
    <line x1="128" y1="128" x2="128" y2="86"  stroke="#ffffff" stroke-width="11"/>
    <line x1="128" y1="128" x2="166" y2="142" stroke="#8f83e8" stroke-width="11"/>
  </g>
  <circle cx="128" cy="128" r="9" fill="#ffffff"/>
</svg>
