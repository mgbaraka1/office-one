name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run pack
      # Deliberately last: this is the only step that depends on a service
      # outside GitHub, so it is the one most likely to fail for reasons that
      # have nothing to do with the commit. On 2026-09-04 npm's advisories
      # endpoint was answering 503 and timing out; running second, it failed the
      # build twice on a good commit and skipped lint, tests, e2e and pack
      # entirely -- so the run reported nothing at all about the code, and a run
      # that looked like "just the flaky audit" would equally have hidden a real
      # test failure. Running it last keeps the gate and still gets that signal.
      # The script is shared with release.yml; see its header for the rest.
      - name: Audit production dependencies
        shell: pwsh
        run: ./scripts/audit-production-deps.ps1
