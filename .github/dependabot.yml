version: 2

# Version-update pull requests are switched off: `open-pull-requests-limit: 0`
# is the documented way to keep a Dependabot config while stopping the routine
# weekly bumps. Security updates still open a PR when an advisory affects a
# dependency, which is the only automated bump this project wants -- a desktop
# app has no deploy cadence to keep up with, and an Electron major touches the
# Node build that `node:sqlite` runs on, so it needs a deliberate, tested
# upgrade rather than a merge button.

updates:
  # The workflows pin every action to a commit SHA with the tag in a trailing
  # comment. Dependabot understands that form and bumps both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci

  # bcryptjs is the sole runtime dependency; everything else here is Electron
  # and electron-builder.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      build-toolchain:
        patterns:
          - electron
          - electron-builder
